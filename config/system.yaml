modules:
  task_hub: true
  sensor_gimbal: true
  charge: true
  sensors: true
  alarm: true
  light: true
  gas: true
  sensor_rs485: true
  acoustic: true
  mqtt: true
  mission_execution_agent: false



mission_execution_agent:
  robot_id: x30-A
  heartbeat_topic: /mission_execution/heartbeat
  fleet_state_topic: /fleet/state
  odometry_topic: /odometry_multi_maps
  odometry_max_age_seconds: 3.0
  task_hub_status_service: /get_status
  planning_leader: true
  leader_epoch: 1
  heartbeat_period_seconds: 1.0
  device_status_path: /home/cat/Workspace/task_ws/src/inspection_platform_bridge/platform/device_status.json
  # Keep false until generated route YAML has been manually verified.
  auto_execute: false
  task_hub_start_service: /start_route
  task_hub_pause_service: /pause_route
  task_hub_cancel_service: /cancel_route
  task_event_topic: /mission_execution/task_event
  task_event_ack_topic: /mission_execution/task_event_ack
  mission_control_topic: /mission_execution/mission_control
  mission_control_ack_topic: /mission_execution/mission_control_ack
  task_addition_topic: /mission_execution/task_addition
  task_addition_status_topic: /mission_execution/task_addition_status
  task_addition_retry_seconds: 2.0
  task_addition_response_timeout_seconds: 60.0
  task_event_resend_seconds: 2.0
  # All mission input, generated plans and route YAML stay with this package.
  data_root: /home/cat/Workspace/task_ws/src/mission_execution_agent/runtime

mqtt:
  sn: x30-A
  host: 47.99.202.196
  port: 20402
  username: "jiangxi"
  password: "Fhzn@1234"
  fleet_heartbeat_mqtt_suffix: fleet/heartbeat
  fleet_state_mqtt_topic: fh/fleet/state
  topic_vendor_prefix: fh
  topic_root: device
  map_root_directory: /home/cat/Workspace/Maps
  # MQTT mission receive/publish audit, retained with the bridge package.
  mission_record_directory: /home/cat/Workspace/task_ws/src/inspection_platform_bridge/runtime/records
  localization_set_parameters_service: /navigation_bringup/start
  manual_map_switch_service_name: /manual_switch_current_map
  localization_map_parameter_name: slam.prior_dir
  localization_initial_map_parameter_name: global_planner.initial_map
  localization_set_parameter_timeout_sec: 60.0
  localization_service_wait_timeout_sec: 5.0
  acoustic_start_service_name: /monitor/acoustic/start
  acoustic_stop_service_name: /monitor/acoustic/stop
  thermal_start_service_name: /monitor/thermal_camera/start
  thermal_stop_service_name: /monitor/thermal_camera/stop
  thermal_detection_service_name: /task_hub/thermal_detection
  gas_start_service_name: /monitor/gas/start
  gas_stop_service_name: /monitor/gas/stop
  stand_service_name: /nav_bridge_node/stand
  release_control_service_name: /nav_bridge_node/release_control
  lie_service_name: /nav_bridge_node/lie
  soft_estop_service_name: /nav_bridge_node/soft_estop
  charge_exit_service_name: /task_hub/charge_exit
  # 供任务中枢上传单点算法输入图片。
  media_upload_service_name: /platform/media/upload
  # 平台手操固定速度：前后/斜向 x、横移/斜向 y、原地转向角速度。
  manual_jog_linear_x_speed: 1.0
  manual_jog_linear_y_speed: 0.6
  manual_jog_angular_speed: 1.2
  manual_jog_max_linear_x_speed: 1.0
  manual_jog_max_linear_y_speed: 0.6
  manual_jog_max_angular_speed: 1.2
  manual_jog_max_duration_ms: 2500

algorithm_mqtt:
  host: 47.99.202.196
  port: 20402
  username: "jiangxi"
  password: "Fhzn@1234"
  topic_root: algorithm/device
  database_path: "~/.ros/inspection_platform_bridge/algorithm_queue.db"
  max_attempts: 3
  result_drain_timeout_sec: 30.0

live_stream:
  config_path: ""
  algorithm_visible_stream_url_topic: "/platform/live_stream/gimbal_vis/url"
  # disabled | always | task_scoped. always keeps streams active without a task.
  push_policy: always
  request_on_startup: true
  ffmpeg_bin: ffmpeg
  restart_interval_sec: 1.0
  gimbal:
    enabled: true
  acoustic:
    enabled: true
    topic: /monitor/acoustic/overlay
    status_topic: /platform/acoustic_sensor_stream/status
    fps: 10.0
    bitrate: 1500k
    video_codec: h264_rkmpp
    output_format: flv
    restart_interval_sec: 5.0
  acoustic_camera:
    enabled: false
    topic: /monitor/acoustic/camera
    status_topic: /platform/acoustic_camera_stream/status
    fps: 10.0
    bitrate: 1500k
    video_codec: h264_rkmpp
    output_format: flv
    restart_interval_sec: 5.0
  acoustic_heatmap:
    enabled: false
    topic: /monitor/acoustic/heatmap
    status_topic: /platform/acoustic_heatmap_stream/status
    fps: 10.0
    bitrate: 1500k
    video_codec: h264_rkmpp
    output_format: flv
    restart_interval_sec: 5.0
  ffmpeg:
    loglevel: warning
    realtime_input: false
    rtsp_transport: tcp
    video_codec: copy
    audio_codec: copy
    output_format: flv

task_hub:
  smoke_monitor_prefix: "/monitor/smoke"
  atmospheric_monitor_prefix: /monitor/atmospheric
  atmospheric_properties_status_topic: /monitor/atmospheric/status
  acoustic_start_service_name: /monitor/acoustic/start
  acoustic_stop_service_name: /monitor/acoustic/stop
  acoustic_set_parameters_service_name: /monitor/acoustic/set_parameters
  default_route_config_path: ""
  runtime_log_directory: "~/runtime_logs"
  # 每条巡检路线结束后，在 runtime_log_directory 下生成 Markdown 报告和异常图片副本。
  # 图片与 Markdown 文件平铺在同一个 inspection_<...> 目录中。
  inspection_report_enabled: true
  inspection_report_name: "常规巡检"
  inspection_report_copy_local_media: true
  algorithm_execute_url: "http://111.77.141.65:15680/openApi/gateway/algorithm/loop/execute"
  algorithm_stop_url: "http://111.77.141.65:15680/openApi/gateway/algorithm/loop/stop"
  # Fixed input stream consumed by the algorithm center. This is independent
  # from the RTMP stream used by the platform for live display.
  algorithm_visible_stream_url: "rtsp://192.168.110.88:554/live/x30/gimbal/vis"
  algorithm_dynamic_stream_url_enabled: false
  algorithm_visible_stream_url_topic: "/platform/live_stream/gimbal_vis/url"
  algorithm_stream_url_wait_timeout_seconds: 10.0
  # 单点算法先拍照并通过平台桥上传，再以 requestParams.imageUrl 调用算法中心。
  algorithm_media_upload_service: "/platform/media/upload"
  algorithm_capture_timeout_seconds: 20.0
  algorithm_media_upload_timeout_seconds: 30.0
  algorithm_callback_url: "http://47.99.202.196:20756/api/v1/algorithm/result"
  algorithm_callback_port: 8081
  algorithm_http_timeout_seconds: 10
  passive_charge_arrival_battery_reserve_percent: 10
  stand_service_name: "/nav_bridge_node/stand"
  lie_service_name: "/nav_bridge_node/lie"
  set_gait_service_name: "/nav_bridge_node/set_gait"
  navigation_action_name: "multi_map_navigate_to_pose"
  gimbal_action_name: "follow_joint_trajectory"
  capture_action_name: "capture_media"
  navigation_validate_waypoints_service: "/validate_route_waypoints"
  require_waypoint_validation_success: false
  navigation_heartbeat_topic: "/inspection_task_hub/heartbeat/navigation"
  gimbal_heartbeat_topic: "/inspection_task_hub/heartbeat/gimbal"
  odometry_topic: "/odometry_multi_maps"
  robot_basic_state_topic: "/robot_basic_state"
  charge_manager_state_topic: "/charge_manager_state"
  charge_exit_executor_service_name: "/inspection_charge_executor/exit_charge"
  heartbeat_timeout_seconds: 3.0
  robot_state_timeout_seconds: 3.0
  trigger_service_timeout_seconds: 30.0
  manual_mode_ready_timeout_seconds: 60.0

gimbal:
  params_file: ""
  camera_backend: "gimbal_hk"
  launch_post_waypoint_home_bridge: false
  use_http_isapi_absolute_ptz: true

sensor_gimbal:
  enable_gimbal: true
  enable_thermal: true
  enable_smoke: false
