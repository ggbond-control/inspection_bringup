# Only D1M differences; omitted fields inherit config/navigate.yaml.
bringup:
  modes:
    manual:
      sequence:
        - nav_bridge
        - acquire_control
        - slam
    nav:
      # Inherit control_action: acquire_control; start_control_action is invalid.
      sequence:
        - nav_bridge
        - acquire_control
        - slam
        - terrain
        - local_planner
        - global_planner
    add:
      # An omitted/commented field would inherit release_control on warm switches.
      # Cold starts retain the inherited startup_control_action: acquire_control.
      control_action: ""
      sequence:
        - nav_bridge
        - acquire_control
        - release_control
        - slam
        - terrain
        - local_planner
        - global_planner
  start_delay_seconds: 0.0

nav_bridge:
  robot_type: d1_max
  params_file: "${INSPECTION_CONFIG_DIR}/navigation/nav_bridge/d1_max_params.yaml"
slam:
  config: "${INSPECTION_CONFIG_DIR}/navigation/faster_lio/airy.yaml"
local_planner:
  config: "${INSPECTION_CONFIG_DIR}/navigation/local_planner/d1m.yaml"
global_planner:
  params_file: straight_local
  params_path: "${INSPECTION_CONFIG_DIR}/navigation/multi_map_nav/straight_local.yaml"
