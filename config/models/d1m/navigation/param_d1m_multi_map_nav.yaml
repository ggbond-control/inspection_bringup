# D1M uses SmacStraightPlanner; shared parameters inherit the default.
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.5, 0.235], [0.5, -0.235], [-0.5, -0.235], [-0.5, 0.235]]"
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.8  # Broad cost field for the 1.0 x 0.47 m robot

planner_server:
  ros__parameters:
    GridBased:
      plugin: "smac_straight_planner::SmacStraightPlanner"
      cost_travel_multiplier: 2.0
      straightening:
        output_spacing: 0.05
        collision_check_step: 0.025
        min_clearance: 0.02  # Extra distance beyond the already padded footprint
        max_shortcut_length: 20.0
        shortcut_candidate_spacing: 0.25
        max_cost_ratio: 1.05
        max_center_cost: 252
        peak_cost_tolerance: 5
        corner_radius: 0.4  # Preferred fillet radius; shorten in short segments
        min_corner_angle: 0.17453292519943295  # 10 degrees
        max_corner_angle: 2.6179938779914944   # 150 degrees
        max_shortcut_time: 1.0  # Optimization only; final validation is mandatory

multi_map_nav_node:
  ros__parameters:
    normal_xy_tolerance: 0.1   # Position tolerance (meters)
    normal_yaw_tolerance: 0.1  # Heading tolerance (radians)
