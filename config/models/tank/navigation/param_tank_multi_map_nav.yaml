# TANK: 1.10 x 0.70 m; SLAM base_link now follows the centered horizon position.
# Padding inherits the 0.05 m default.
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.55, 0.35], [0.55, -0.35], [-0.55, -0.35], [-0.55, 0.35]]"

local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[[0.55, 0.35], [0.55, -0.35], [-0.55, -0.35], [-0.55, 0.35]]"

planner_server:
  ros__parameters:
    GridBased:
      minimum_turning_radius: 0.0

multi_map_nav_node:
  ros__parameters:
    normal_xy_tolerance: 0.4   # Position tolerance (meters)
    normal_yaw_tolerance: 0.5  # Heading tolerance (radians)
