# TANK initially reuses the Cyvet new_local planner configuration.
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.35, 0.235], [0.35, -0.235], [-0.35, -0.235], [-0.35, 0.235]]"

planner_server:
  ros__parameters:
    GridBased:
      minimum_turning_radius: 0.0

multi_map_nav_node:
  ros__parameters:
    normal_xy_tolerance: 0.25   # Position tolerance (meters)
    normal_yaw_tolerance: 0.25  # Heading tolerance (radians)
