# Cyvet currently uses the same Mid360 baseline as X30, with RTK disabled.
# Keep sensor topics and the self-filter box explicit for each model.
laser_mapping:
  ros__parameters:
    common:
      lid_topic: "/livox/lidar"  # Mid360 point cloud input
      imu_topic: "/livox/imu"    # IMU input
    publish:
      # Navigation center is 0.105 m behind the old horizon origin; no extra rotation.
      # Raw body/IMU outputs and the input self-filter remain in their original frames.
      horizon_offset: [-0.33, 0.0, 0.0]
    preprocess:
      # Input frame: body center 0.105 m behind LiDAR;
      self_box_half_size: [0.38, 0.18, 0.3]  # 过滤盒半尺寸 [x, y, z]，开启后会滤除盒内点
      self_box_offset: [-0.33, 0.0, 0.0]    # 过滤盒中心在输入点云坐标系中的位置 [x, y, z]，单位米
