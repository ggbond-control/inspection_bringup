# Copy to robot.yaml and set this device's model and identity.
# robot.yaml is ignored by Git. Uncomment only the overrides you need.
# Restart the affected bringup service after editing; active snapshots do not reload.
# Supported models: x30 / d1m / cyvet. Use unique IDs matching your fleet list.
# Robot IDs use uppercase model names: X30-A / D1M-A / CYVET-A.
model: d1m
robot_id: D1M-A

# Dictionaries merge recursively; lists replace the ENTIRE inherited list.
# mqtt.sn and mission_execution_agent.robot_id automatically use robot_id.
# system:
#   task_hub:
#     obstacle_snapshot_enabled: false  # 障碍事件与日志总开关，默认关闭
#     obstacle_photo_enabled: false     # 遇障拍照，需同时开启总开关，默认关闭
#   mqtt:
#     host: mqtt.example.com
#     port: 1883
#     username: "your-username"
#     password: "your-password"
#   # Algorithm MQTT has independent connection settings; override if used.
#   algorithm_mqtt:
#     host: mqtt.example.com
#     port: 1883
#     username: "your-username"
#     password: "your-password"
#   fleet_leader_election:
#     robot_ids: [D1M-A, D1M-B]

