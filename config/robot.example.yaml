#           extrinsic_parameter:
#             roll: 0.0    # Degrees
#             pitch: 0.0   # Degrees
#             yaw: 0.0     # Degrees
#             x: 0.0       # Millimeters (Livox SDK), not meters
#             y: 0.0
#             z: 0.0
