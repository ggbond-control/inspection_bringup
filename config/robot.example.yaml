#     parameters:
#       MID360:
#         host_net_info:
#           host_ip: "169.254.181.1"  # Host interface address; it must be configured on the OS
#       # Replaces all LiDAR entries: include EVERY device and its full extrinsics.
#       # Do not use this one-LiDAR example on X30: it would remove its other 3 LiDARs.
#       lidar_configs:
#         - ip: "169.254.181.169"
