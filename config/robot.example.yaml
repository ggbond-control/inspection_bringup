# Copy to robot.yaml and set this device's model and identity.
# robot.yaml is ignored by Git. Uncomment only the overrides you need.
# Restart the affected bringup service after editing; active snapshots do not reload.
# Supported models: x30 / d1m / cyvet. Use unique IDs matching your fleet list.
# tank / TANK-A and r750 / R750-A (TARKBOT four-wheel differential): nav_bridge
# configuration and build only; r750 reuses TANK geometry pending on-hardware tuning.
# Robot IDs use uppercase model names: X30-A / D1M-A / CYVET-A / TANK-A / R750-A.
model: d1m
robot_id: D1M-A

# Dictionaries merge recursively; lists replace the ENTIRE inherited list.
# mqtt.sn, device status SN and cooperation.robot_id automatically use robot_id.
# system:
#   cooperation:
#     mode: disabled  # disabled | coordination | swarm
#   # Device metadata replaces inspection_platform_bridge/platform/device_status.json.
#   # Inherit shared -> model defaults; only override hardware differences here.
#   # Both lists below replace their inherited lists in full (not individual elements).
#   device_status:
#     Battery_RC: 22.4            # Example only: use this device's actual rating.
#     Battery_RC_unit: Ah        # Ah | Wh; set both battery fields null if unknown.
#     nominal_speed_mps: 1.0
#     capabilities: [device, visible_camera, thermal_camera]  # Example: gimbal-only device.
#     subDevices:
#       - identifier: gimbal
#         name: 云台
#         supportStream: false
#         subDevices:
#           - {identifier: vis, name: 可见光摄像头, supportStream: true}
#           - {identifier: ir, name: 红外摄像头, supportStream: true}
#   task_hub:
#     obstacle_snapshot_enabled: false  # 障碍事件与日志总开关，默认关闭
#     obstacle_photo_enabled: false     # 遇障拍照，需同时开启总开关，默认关闭
#   mqtt:
#     host: mqtt.example.com
#     port: 1883
#     username: "your-username"
#     password: "your-password"
#   # Algorithm MQTT has independent connection settings; override if used.
#   algorithm_mqtt:
#     host: mqtt.example.com
#     port: 1883
#     username: "your-username"
#     password: "your-password"

